<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小狗算数 · 全家赛跑</title>
<style>
:root{--sky1:#8fd3ff;--sky2:#e9f7ff;--hill:#9be083;--ground:#6cc55a;--ground2:#58ad48;--card:#fffdf6;--ink:#27406b;--btn:#ffd45c;--btn-ink:#5a3b00;--ok:#8fd98a;--bad:#ffb4b4;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#17294a;--sky2:#35507e;--hill:#3f8a3a;--ground:#2f7a2d;--ground2:#266524;--card:#22314d;--ink:#eaf2ff;--btn:#e8b93f;--btn-ink:#3a2600;--ok:#3f8a4a;--bad:#8a3a3a}}
:root[data-theme="dark"]{--sky1:#17294a;--sky2:#35507e;--hill:#3f8a3a;--ground:#2f7a2d;--ground2:#266524;--card:#22314d;--ink:#eaf2ff;--btn:#e8b93f;--btn-ink:#3a2600;--ok:#3f8a4a;--bad:#8a3a3a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;margin:0}
body{background:var(--sky2);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input{font-family:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.topbar{width:min(94vw,640px);display:flex;flex-direction:column;align-items:center;gap:8px}
.clock{font-size:28px;font-weight:800;background:var(--card);border-radius:16px;padding:4px 16px;font-variant-numeric:tabular-nums}
.clock.danger{background:#ffd0d0;color:#8d1212}
.top{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:16px;font-weight:800}
.top span{background:var(--card);border-radius:16px;padding:4px 12px}
.rule{width:min(94vw,640px);text-align:center;font-size:15px;font-weight:800;line-height:1.45}
.linkbtn{border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:800;padding:0}
.stage{width:min(94vw,640px);position:relative;padding:34px 14px 14px;border-radius:30px;background:linear-gradient(var(--sky1),var(--sky2));display:flex;flex-direction:column;gap:26px}
.stage.plane{--sky1:#6ec8ff;--sky2:#e7f6ff}
.stage.pong{--sky1:#1f8a4c;--sky2:#8fd9a8;padding:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage.plane{--sky1:#1a3f6c;--sky2:#2d5a8a}:root:not([data-theme="light"]) .stage.pong{--sky1:#145c36;--sky2:#1f7a48}}
:root[data-theme="dark"] .stage.plane{--sky1:#1a3f6c;--sky2:#2d5a8a}
:root[data-theme="dark"] .stage.pong{--sky1:#145c36;--sky2:#1f7a48}
.lane{position:relative;height:84px;border-radius:24px;background:var(--ground);border-bottom:6px solid var(--ground2);z-index:1}
.lane:nth-child(even){background:var(--hill)}
.lane.plane{background:rgba(255,255,255,.35);border-bottom-color:rgba(255,255,255,.45)}
.lane.now{box-shadow:0 0 0 4px var(--btn)}
.tag{position:absolute;left:8px;top:-22px;font-size:15px;font-weight:800;background:var(--card);border-radius:12px;padding:1px 10px;z-index:5}
.actor{position:absolute;left:10px;bottom:6px;width:96px;transition:left .75s ease-in-out;z-index:3}
.actor svg{display:block;width:100%;height:auto;overflow:visible}
.paw{position:absolute;bottom:14px;font-size:15px;opacity:.45;z-index:2;transform:rotate(90deg)}
.bone{position:absolute;right:10px;bottom:24px;width:52px;height:23px;z-index:2;transform-origin:0 50%;animation:bob 1.8s ease-in-out infinite alternate}
.lane.plane .bone{width:72px;height:46px;bottom:18px}
.bone svg{width:100%;height:100%}
@keyframes bob{to{transform:translateY(-5px) rotate(-6deg)}}
.bone.eaten{animation:eaten .8s ease-in forwards}
@keyframes eaten{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(0);opacity:0}}
.tail{transform-origin:26px 54px;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.leg{transform-box:fill-box;transform-origin:50% 8%}
.run .la{animation:swing .26s ease-in-out infinite alternate}
.run .lb{animation:swing .26s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.run svg,.fly svg{animation:hop .26s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px)}}
.run .tail{animation-duration:.2s}
.head{transform-origin:90px 58px}
.eat .head{animation:chomp .42s ease-in-out infinite alternate}
@keyframes chomp{from{transform:rotate(4deg)}to{transform:rotate(17deg)}}
.oops .head,.oops svg{animation:nope .4s}
@keyframes nope{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.bub{position:absolute;right:4px;top:-26px;background:#fff;color:#27406b;font-weight:800;font-size:17px;padding:1px 10px;border-radius:12px;opacity:0;transform:scale(.4)}
.bub.say{animation:pop .9s ease-out}
@keyframes pop{15%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.heart,.boom{position:absolute;z-index:6;pointer-events:none}
.heart{bottom:50px;font-size:24px;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translateY(-80px);opacity:0}}
.boom{right:16px;bottom:28px;font-size:32px;animation:pop .7s ease-out forwards}
.bullet{position:absolute;bottom:36px;height:7px;width:16px;border-radius:7px;background:#ffd45c;z-index:4;transition:left .42s linear}
.skydecor{pointer-events:none;position:absolute;inset:0;overflow:hidden}
.cloud{position:absolute;font-size:28px;opacity:.75}
.c1{left:8%;top:8px}.c2{right:10%;top:26px;font-size:22px}
.pongnames{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pongnames span{background:var(--card);color:var(--ink);border-radius:14px;padding:4px 10px;font-weight:800}
.pongnames span.on{box-shadow:0 0 0 4px var(--btn)}
.table{position:relative;height:190px;border-radius:18px;background:#2f9e57;border:6px solid #f4f1e8;overflow:hidden}
.net{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(#fff 0 8px,transparent 8px 14px)}
.paddle{position:absolute;width:14px;height:58px;border-radius:8px;background:#ffd45c;top:62px}
.paddle.left{left:12px}.paddle.right{right:12px;box-shadow:0 0 0 4px #fff}
.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;left:76%;top:42%;box-shadow:inset -4px -3px 0 #e4e4e4;transition:left .35s ease-in,top .35s ease-in}
.ball.drop{top:120%}
.card{background:var(--card);border-radius:28px;padding:16px 18px 18px;width:min(94vw,640px);text-align:center}
.big{font-size:28px;font-weight:800;line-height:1.45}
.subhead{font-size:16px;font-weight:800;opacity:.75;margin-bottom:8px}
.label{font-size:15px;font-weight:800;margin:12px 0 6px;text-align:left}
.hint{font-size:14px;font-weight:700;opacity:.8;min-height:20px;text-align:left;line-height:1.4}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{font-size:16px;font-weight:800;padding:8px 12px;border:0;border-radius:16px;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.pick.on{background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 rgba(0,0,0,.16)}
.who{font-size:22px;font-weight:800;text-align:left}
.whorow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qsec{font-size:28px;font-weight:800;min-width:52px;font-variant-numeric:tabular-nums}
.qsec.danger{color:#d92b2b}
.timer{height:8px;background:rgba(0,0,0,.08);border-radius:8px;overflow:hidden;margin-bottom:8px}
.timer>div{height:100%;width:100%;background:#6cc55a;border-radius:8px}
.timer.danger>div{background:#e23d3d}
.sub{font-size:15px;font-weight:800;opacity:.75;margin-top:2px}
.q{font-size:48px;font-weight:800;margin:6px 0 12px;letter-spacing:1px;min-height:64px;display:flex;align-items:center;justify-content:center;line-height:1.15;word-break:break-word}
.q.word{font-size:42px;letter-spacing:0}
.q.char{font-size:76px}
.opts{display:flex;gap:10px}
.opts button{flex:1;font-size:34px;font-weight:800;padding:12px 4px;border:0;border-radius:22px;background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.opts.words button,.opts.py button{font-size:24px;padding:14px 6px}
.opts.py button{font-family:"Segoe UI","PingFang SC","Noto Sans",sans-serif}
.opts button:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.opts button:disabled{cursor:default}
.opts button.right{background:#8fd98a;color:#143018}
.opts button.bad{background:#ffb4b4;color:#5a1a1a}
.msg{min-height:28px;font-size:18px;font-weight:700;margin-top:12px;line-height:1.4}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.btn{margin:8px 6px 0;font-size:22px;font-weight:800;padding:12px 22px;border:0;border-radius:22px;background:var(--btn);color:var(--btn-ink)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:28px;justify-content:center}
.row input[type=checkbox]{width:26px;height:26px}
.row input[type=text]{font-size:18px;width:132px;padding:8px 12px;border-radius:14px;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.hide{display:none}
@media (max-width:480px){
.q{font-size:40px}.q.char{font-size:64px}.q.word{font-size:34px}
.opts button{font-size:28px}.opts.words button,.opts.py button{font-size:20px}
.row input[type=text]{width:108px}
}
@media (prefers-reduced-motion:reduce){
.bone,.tail,.actor,.ball,.bullet,.heart,.boom{animation:none!important;transition:none!important}
}
</style>
</head>

    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;

    g.gain.exponentialRampToValueAtTime(0.05,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);

  }catch(e){}
}

  roundGoal=roundGoalFor();
  lastOp='';lastPrompt='';
  players=list.map(function(p){p.step=0;p.stars=saved.stars[p.name]||0;return p});
  turn=0;over=false;locked=true;
  show('setup',false);show('win',false);show('play',true);show('stage',true);showHUD(true);
  buildStage();renderTop();renderRule();startMatch();nextQ();
}
function again(){
  clearTimers();over=false;locked=true;turn=0;lastPrompt='';
  resetRound();show('win',false);show('play',true);renderTop();startMatch();nextQ();
}
function back(){
  clearTimers();over=true;locked=true;players=[];
  show('stage',false);show('play',false);show('win',false);showHUD(false);
  $('top').innerHTML='';show('setup',true);buildSetup();
}
$('start').onclick=startGame;
$('again').onclick=again;
$('back').onclick=back;
$('quit').onclick=back;
window.addEventListener('resize',function(){if(players.length&&!over&&settings.mode!=='pong'&&!$('stage').classList.contains('hide'))place(false)});
buildSetup();
</script>
</body>
</html>
